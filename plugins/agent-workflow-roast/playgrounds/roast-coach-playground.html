<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Workflow Roast Coach Playground</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1118;
        --panel: #121b26;
        --panel-2: #172333;
        --line: #26364a;
        --text: #eef5ff;
        --muted: #9fb0c4;
        --blue: #65a3ff;
        --green: #70d69a;
        --orange: #f2b25d;
        --purple: #b79cff;
        --danger: #ff8b7f;
        --focus: #9cc6ff;
        --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --text-caption: 0.75rem;
        --text-label: 0.875rem;
        --text-body: 1rem;
        --text-title: 1.25rem;
        --text-display: 1.75rem;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.5;
        font-kerning: normal;
      }

      .shell {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 18px;
        min-height: 100vh;
        padding: 18px;
      }

      aside,
      main,
      .prompt-box {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      aside {
        padding: 18px;
      }

      h1,
      h2,
      h3,
      p {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 8px;
        font-size: var(--text-display);
        line-height: 1.15;
        text-wrap: balance;
      }

      h2 {
        margin-bottom: 10px;
        font-size: var(--text-title);
        line-height: 1.2;
        text-wrap: balance;
      }

      aside > p {
        max-width: 30ch;
        color: var(--muted);
        font-size: var(--text-label);
        line-height: 1.5;
      }

      .section-label {
        margin: 22px 0 10px;
        color: var(--text);
        font-size: var(--text-label);
        font-weight: 760;
      }

      label {
        display: grid;
        gap: 8px;
        margin: 14px 0;
        color: var(--muted);
        font-size: var(--text-label);
        font-weight: 650;
        line-height: 1.35;
      }

      select,
      input,
      textarea,
      button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--panel-2);
        color: var(--text);
        font: inherit;
      }

      select,
      input,
      button {
        min-height: 38px;
        padding: 0 10px;
      }

      select:hover,
      input:hover,
      textarea:hover,
      button:hover {
        border-color: #426083;
      }

      select:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 3px solid rgb(156 198 255 / 0.32);
        outline-offset: 2px;
        border-color: var(--focus);
      }

      button {
        cursor: pointer;
        transition: background-color 160ms ease-out, border-color 160ms ease-out, color 160ms ease-out, transform 160ms ease-out;
      }

      button:active {
        transform: translateY(1px);
      }

      button[aria-pressed="true"] {
        border-color: var(--blue);
        background: rgb(101 163 255 / 0.18);
        color: var(--text);
      }

      textarea {
        min-height: 92px;
        padding: 10px;
        resize: vertical;
        line-height: 1.45;
      }

      .preset-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .primary {
        background: #1f5fbf;
        border-color: #3a7ee3;
      }

      .secondary {
        margin-top: 10px;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 18px;
      }

      .preview {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 14px;
      }

      .workbench-readout,
      .signal-panel,
      .card {
        padding: 16px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .workbench-readout {
        display: grid;
        align-content: start;
        min-height: 210px;
        background: #101a26;
      }

      .card p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: var(--text-label);
        line-height: 1.5;
      }

      .workbench-readout p,
      .signal-panel p,
      .glance-card p {
        margin-bottom: 0;
        color: var(--muted);
        font-size: var(--text-label);
        line-height: 1.5;
      }

      .read-title {
        margin: 12px 0 8px;
        font-size: var(--text-display);
        line-height: 1.18;
      }

      .glance {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .glance-card {
        padding: 12px;
        background: #121e2b;
        border: 1px solid rgb(159 176 196 / 0.2);
        border-radius: 8px;
      }

      .glance strong {
        display: block;
        margin-bottom: 4px;
        font-size: var(--text-label);
        line-height: 1.25;
      }

      .pill {
        display: inline-flex;
        width: fit-content;
        padding: 4px 8px;
        border-radius: 999px;
        background: rgb(101 163 255 / 0.14);
        color: var(--blue);
        font-size: var(--text-caption);
        font-weight: 700;
        line-height: 1.2;
      }

      .rule {
        display: grid;
        gap: 8px;
        margin-top: 10px;
        padding: 12px;
        background: #101a26;
        border: 1px solid rgb(159 176 196 / 0.2);
        border-radius: 8px;
      }

      .field-topline,
      .field-note {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
      }

      .field-note {
        margin-top: -4px;
        color: var(--muted);
        font-size: var(--text-caption);
        font-weight: 500;
      }

      output {
        color: var(--text);
        font-family: var(--font-mono);
        font-size: var(--text-caption);
        font-weight: 760;
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .metric {
        display: grid;
        gap: 8px;
      }

      .metric strong {
        color: var(--text);
        font-size: 1rem;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
      }

      .bar {
        height: 7px;
        overflow: hidden;
        background: #26364a;
        border-radius: 999px;
      }

      .bar span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--blue), var(--green));
      }

      code,
      pre {
        font-family: var(--font-mono);
      }

      code {
        display: block;
        white-space: pre-wrap;
        color: #d8e7ff;
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .prompt-box {
        padding: 14px;
        border-color: #3a5170;
        background: #111d2a;
      }

      .prompt-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
      }

      .prompt-head button {
        width: 110px;
      }

      pre {
        margin: 10px 0 0;
        color: #d6e4f7;
        font-size: 0.875rem;
        white-space: pre-wrap;
        line-height: 1.55;
      }

      .prompt-title {
        margin-bottom: 0;
        font-size: var(--text-title);
        line-height: 1.2;
      }

      .copy-error {
        color: var(--danger);
      }

      @media (max-width: 900px) {
        .shell,
        .preview,
        .metric-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <h1>Insights Coach Playground</h1>
        <p>Explore how the LLM pass should turn raw session signals into coaching.</p>

        <h2 class="section-label">Presets</h2>
        <div class="preset-row">
          <button data-preset="exec" aria-pressed="false">Execution Coach</button>
          <button data-preset="design" aria-pressed="false">Design Iteration</button>
          <button data-preset="prompt" aria-pressed="false">Prompt Fluency</button>
          <button data-preset="rules" aria-pressed="false">Rules Export</button>
        </div>
        <button class="secondary" id="reset" type="button">Reset brief</button>

        <label>
          Coaching tone
          <select id="tone">
            <option value="direct">Direct and kind</option>
            <option value="gentle">Gentle mentor</option>
            <option value="sharp">Sharp retro</option>
          </select>
        </label>

        <label>
          Primary outcome
          <select id="outcome">
            <option value="rules">Copy-ready local rules</option>
            <option value="prompts">Better prompts</option>
            <option value="friction">Friction diagnosis</option>
            <option value="style">Working-style read</option>
          </select>
        </label>

        <label>
          <span class="field-topline">
            <span>Evidence strictness</span>
            <output id="strictnessValue" for="strictness">4/5</output>
          </span>
          <input id="strictness" type="range" min="1" max="5" value="4" />
          <span class="field-note" id="strictnessNote">Label weak evidence</span>
        </label>

        <label>
          Example friction
          <textarea id="friction">Missing acceptance proof; repeated auth drift; long planning loop before first change.</textarea>
        </label>
      </aside>

      <main>
        <section class="preview">
          <article class="workbench-readout">
            <span class="pill">Coach's read</span>
            <h2 class="read-title" id="readTitle">Execution-heavy, proof-hungry workflow</h2>
            <p id="narrative"></p>
          </article>
          <article class="card">
            <span class="pill">Signals</span>
            <div class="glance" id="glance"></div>
          </article>
        </section>

        <section class="signal-panel">
          <span class="pill">Generated rules</span>
          <div id="rules"></div>
        </section>

        <section class="signal-panel">
          <span class="pill">Effectiveness signals</span>
          <div class="metric-grid" id="metrics"></div>
        </section>

        <section class="prompt-box">
          <div class="prompt-head">
            <h2 class="prompt-title">Prompt to use in the analyzer</h2>
            <button class="primary" id="copy">Copy prompt</button>
          </div>
          <pre id="prompt"></pre>
        </section>
      </main>
    </div>

    <script>
      const defaults = {
        tone: "direct",
        outcome: "rules",
        strictness: 4,
        friction: "Missing acceptance proof; repeated auth drift; long planning loop before first change.",
      };
      const state = { ...defaults };
      const presets = {
        exec: { tone: "direct", outcome: "rules", strictness: 4 },
        design: { tone: "gentle", outcome: "friction", strictness: 3, friction: "Visual mismatch corrections; spacing drift; icons did not match the mockup." },
        prompt: { tone: "sharp", outcome: "prompts", strictness: 5, friction: "Ambiguous asks; acceptance criteria missing; too much implementation before alignment." },
        rules: { tone: "direct", outcome: "rules", strictness: 5, friction: "Repeated workaround rediscovery; stale environment assumptions; missing durable instruction updates." },
      };

      const elements = {
        tone: document.getElementById("tone"),
        outcome: document.getElementById("outcome"),
        strictness: document.getElementById("strictness"),
        strictnessValue: document.getElementById("strictnessValue"),
        strictnessNote: document.getElementById("strictnessNote"),
        friction: document.getElementById("friction"),
        narrative: document.getElementById("narrative"),
        glance: document.getElementById("glance"),
        rules: document.getElementById("rules"),
        metrics: document.getElementById("metrics"),
        prompt: document.getElementById("prompt"),
        copy: document.getElementById("copy"),
        reset: document.getElementById("reset"),
        presetButtons: document.querySelectorAll("[data-preset]"),
      };

      function syncControls() {
        elements.tone.value = state.tone;
        elements.outcome.value = state.outcome;
        elements.strictness.value = state.strictness;
        elements.friction.value = state.friction;
      }

      function strictnessLabel(strict) {
        if (strict >= 5) return "5/5: demand proof";
        if (strict >= 4) return "4/5: label weak evidence";
        if (strict >= 3) return "3/5: balanced coaching";
        return `${strict}/5: exploratory read`;
      }

      function updateAll() {
        const strict = Number(state.strictness);
        const toneLabel = state.tone === "sharp" ? "blunt but useful" : state.tone === "gentle" ? "encouraging" : "direct and kind";
        const strictLabel = strictnessLabel(strict);
        elements.strictnessValue.value = `${strict}/5`;
        elements.strictnessNote.textContent = strictLabel.replace(/^\d\/5: /, "");
        elements.narrative.textContent = `Use a ${toneLabel} voice. Treat the raw counts as evidence, then explain the working style, the likely root causes, and the next behavior change without pretending weak signals are certain.`;
        replaceChildren(
          elements.glance,
          [
          ["Working", "Preserve visible evidence, verification loops, and concrete project context."],
          ["Hindering", state.friction],
          ["Quick win", state.outcome === "prompts" ? "Rewrite the first prompt with proof and boundaries." : "Add one copy-ready rule for the top friction category."],
          ["Ambitious", "Build a repeatable weekly reflection that tracks whether the rules reduce friction."],
          ].map(([title, body]) => createGlanceCard(title, body)),
        );
        replaceChildren(elements.rules, frictionItems().map(createRule));
        replaceChildren(elements.metrics, metricItems(strict).map(createMetric));
        elements.prompt.textContent = buildPrompt(strict);
      }

      function frictionItems() {
        return state.friction
          .split(";")
          .map((item) => item.trim())
          .filter(Boolean);
      }

      function replaceChildren(parent, children) {
        parent.replaceChildren(...children);
      }

      function markPreset(activePreset) {
        elements.presetButtons.forEach((button) => {
          button.setAttribute("aria-pressed", button.dataset.preset === activePreset ? "true" : "false");
        });
      }

      function createGlanceCard(title, body) {
        const article = document.createElement("article");
        article.className = "glance-card";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const paragraph = document.createElement("p");
        paragraph.textContent = body;
        article.append(strong, paragraph);
        return article;
      }

      function createRule(item) {
        const wrapper = document.createElement("div");
        wrapper.className = "rule";
        const strong = document.createElement("strong");
        strong.textContent = item;
        const code = document.createElement("code");
        code.textContent = "When this pattern appears, pause, name the evidence, and produce a copy-ready instruction that prevents recurrence.";
        wrapper.append(strong, code);
        return wrapper;
      }

      function metricItems(strict) {
        return [
          ["Prompt quality", 55 + strict * 8, "Outcome, constraints, proof."],
          ["Output effectiveness", state.outcome === "friction" ? 68 : 78, "Proof before polish."],
          ["Token effectiveness", strict >= 4 ? 74 : 61, "Less renegotiation."],
        ];
      }

      function createMetric([label, value, coaching]) {
        const article = document.createElement("article");
        article.className = "card metric";
        const strong = document.createElement("strong");
        strong.textContent = `${label}: ${value}`;
        const bar = document.createElement("div");
        bar.className = "bar";
        const fill = document.createElement("span");
        fill.style.width = `${Math.max(0, Math.min(100, value))}%`;
        const paragraph = document.createElement("p");
        paragraph.textContent = coaching;
        bar.append(fill);
        article.append(strong, bar, paragraph);
        return article;
      }

      function buildPrompt(strict) {
        const parts = [
          "Turn raw agent session stats into human-readable coaching.",
          `Use a ${state.tone} coaching tone.`,
          `Optimize for ${state.outcome}.`,
          `Evidence strictness is ${strict}/5: ${strict >= 4 ? "label weak evidence and avoid overclaiming" : "allow more interpretive coaching"}.`,
          `Top observed friction: ${state.friction}`,
          "Return JSON with summary, atAGlance, narrative, roast, frictionAnalysis, promptQuality, effectivenessMetrics, improvements, customInstructions, instructions, workflowPrompts, and prompts.",
          "effectivenessMetrics should power a dashboard for prompt quality, output effectiveness, token-effectiveness proxy, planning clarity, and goal clarity.",
          "customInstructions must be plain text the user can paste into Codex Settings > Custom instructions.",
          "workflowPrompts must be copy-ready prompts to run inside projects to improve AGENTS.md, create project skills, or define specialized agents.",
          "Include an affectionate roast that is funny because it is true and useful.",
        ];
        return parts.join("\n");
      }

      for (const key of ["tone", "outcome", "strictness", "friction"]) {
        elements[key].addEventListener("input", (event) => {
          state[key] = event.target.value;
          updateAll();
        });
      }
      elements.presetButtons.forEach((button) => {
        button.addEventListener("click", () => {
          Object.assign(state, defaults, presets[button.dataset.preset]);
          markPreset(button.dataset.preset);
          syncControls();
          updateAll();
        });
      });
      elements.reset.addEventListener("click", () => {
        Object.assign(state, defaults);
        markPreset("");
        syncControls();
        updateAll();
      });
      elements.copy.addEventListener("click", async () => {
        const original = elements.copy.textContent;
        elements.copy.classList.remove("copy-error");
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(elements.prompt.textContent);
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = elements.prompt.textContent;
            textarea.setAttribute("readonly", "");
            textarea.style.position = "fixed";
            textarea.style.left = "-9999px";
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand("copy");
            textarea.remove();
          }
          elements.copy.textContent = "Copied";
        } catch {
          elements.copy.textContent = "Copy failed";
          elements.copy.classList.add("copy-error");
        } finally {
          setTimeout(() => {
            elements.copy.textContent = original;
            elements.copy.classList.remove("copy-error");
          }, 1400);
        }
      });

      syncControls();
      markPreset("");
      updateAll();
    </script>
  </body>
</html>
